name: BlueTap Combo Duplicate Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combo-duplicate-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove duplicate combo flash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          old = "      else if (response.comboMultiplier > 1) setFlash(`🔥 زنجیره ×${nf.format(response.comboMultiplier)} · ${nf.format(response.comboCount)} ضربه`);\n"
          if old not in text:
              raise SystemExit('Combo flash line not found')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/combo-duplicate-hotfix.yml
          git add apps/web/src/App.tsx
          git commit -m "Remove duplicate combo notification"
          git push origin HEAD:main
