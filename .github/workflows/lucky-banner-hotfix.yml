name: BlueTap Lucky Banner Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bluetap-lucky-banner-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove Lucky Tap full-width flash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/App.tsx')
          text = p.read_text()
          old = "      if (response.luckyHits > 0) setFlash(`🍀 ضربه شانسی ×${nf.format(response.highestLuckyMultiplier)} · +${nf.format(response.luckyBonus)} امتیاز`);"
          new = "      if (response.luckyHits > 0) window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success');"
          if old not in text:
              raise SystemExit('Lucky Tap flash target not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Deploy production Worker
        run: npx wrangler deploy --config apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/lucky-banner-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop Lucky Tap from opening duplicate status banner"
          git push origin main
