name: BlueTap Referral Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/referral-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix referral attribution flow
        run: echo '" | base64 -d | python

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Commit hotfix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/referral-hotfix.yml
          git add apps/api/src/index.ts apps/api/src/bot.ts apps/api/src/telegram.ts apps/api/src/db.ts apps/web/src/api.ts
          git commit -m "Fix referral attribution and invite flow"
          git push origin HEAD:main
